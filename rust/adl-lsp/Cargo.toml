[package]
name = "adl-lsp"
version = "0.9.0"
edition = "2024"
description = "Language Server Protocol implementation for ADL"
license = "MIT"

[dependencies]
anyhow = "1.0"
async-lsp = { version = "0.2.2", features = ["tokio"] }
clap = { version = "4.5.39", features = ["derive"] }
# pinned: ignore >= 0.4.24 requires a newer rustc (let-chains) than the project toolchain (1.85)
ignore = "=0.4.23"
lsp-types = "0.95.1"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.141"
tokio = { version = "1.27.0", features = ["full" ] }
tower = "0.5.2"
tracing = "0.1.41"
tracing-subscriber = "0.3.19"
tree-sitter = "0.25.6"
# Path dependency during the v0.7 migration; the integrator flips this back to
# tree-sitter-adl = "0.7.0" once the grammar is published.
tree-sitter-adl = { path = "../../../tree-sitter-adl" }


[dev-dependencies]
insta = { version = "1.39.0", features = ["yaml"] }
tempfile = "3.8"
